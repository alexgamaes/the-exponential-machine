<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Exponential Machine</title>
  <script>
    // Apply the saved theme before CSS paints (no flash).
    try { const t = localStorage.getItem('tem_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%239b1c1c'/%3E%3Ctext x='8' y='12.5' font-size='12' text-anchor='middle' fill='white' font-family='monospace'%3Ee%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@700&family=Space+Mono:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="era-1939">
  <header id="era">
    <div class="era-left">
      <span id="era-date"></span>
      <span class="sep">·</span>
      <span>You are: <b id="era-role"></b></span>
    </div>
    <div class="era-right">
      <button id="theme-toggle" class="icon-btn" data-action="theme" aria-label="Switch theme">◐</button>
    </div>
  </header>

  <section id="goal">
    <div class="goal-row">
      <span id="goal-tag" class="goal-tag"></span>
      <span id="goal-text" aria-live="polite"></span>
      <span id="goal-nums"></span>
    </div>
    <div class="bar"><div id="goal-fill"></div></div>
  </section>

  <main>
    <section id="core">
      <div id="balances">
        <div class="balance">
          <div id="have-caption" class="caption"><span class="swatch swatch-balance"></span>You have</div>
          <div id="counter" class="counter"><span id="ops"></span> <span id="unit"></span></div>
          <div id="rate" class="rate" hidden></div>
        </div>
        <div class="balance" id="money" hidden>
          <div class="caption"><span class="swatch swatch-money"></span>Money</div>
          <div id="money-text" class="counter"></div>
          <div id="money-rate" class="rate"></div>
        </div>
      </div>
      <div id="total" hidden><span class="swatch swatch-lifetime"></span><span id="total-text"></span></div>
      <div id="team" hidden></div>
      <div id="click-wrap">
        <button id="main-btn" class="main-btn"></button>
        <button id="pass-btn" class="main-btn" data-action="pass" hidden>Pass the ledger on</button>
        <div id="floaters" aria-hidden="true"></div>
      </div>
    </section>

    <aside id="ledger" class="panel" aria-labelledby="ledger-title">
      <h2 id="ledger-title"><span>The ledger</span><button id="log-new" class="link-btn" data-action="log-top" hidden>New lines ↑</button></h2>
      <ol id="log"></ol>
    </aside>

    <div id="columns">
      <div class="col">
      <section id="producers" class="panel" hidden>
        <h2 id="producers-title">Your team</h2>
        <div id="legacy-row" class="legacy" hidden>
          <div class="producer-head"><span id="legacy-label"></span><span class="legacy-tag">Legacy</span></div>
          <p id="legacy-text"></p>
        </div>
        <div id="homes-row" class="producer" hidden>
          <div class="producer-head"><span>Computers in homes</span><span id="homes-owned" class="producer-owned"></span></div>
          <p id="homes-text"><span id="homes-gen"></span><br><span id="homes-total"></span></p>
        </div>
        <div id="producer-list"></div>
        <p id="team-complete" class="muted-note" hidden></p>
      </section>
      <section id="market" class="panel" hidden>
        <h2 id="market-title"></h2>
        <p id="market-intro" class="muted-note first"></p>
        <div id="market-seg" class="seg" role="group"></div>
        <p id="sell-status"></p>
        <div id="models" hidden>
          <p id="model-now" class="model-now"></p>
          <p class="chart-cap">Buyers a second since launch</p>
          <div id="sales-chart" class="chart" aria-hidden="true">
            <span id="chart-max" class="chart-max"></span>
            <svg id="chart-svg" viewBox="0 0 120 40" preserveAspectRatio="none"></svg>
            <span id="chart-capline" class="chart-capline"></span>
          </div>
          <p id="sales-line"></p>
          <div class="lab">
            <p id="lab-line"></p>
            <div class="lab-bar"><div id="lab-fill" class="lab-fill"></div></div>
            <p class="lab-under"><span id="lab-status"></span><span id="lab-limit"></span></p>
            <button id="launch-btn" class="buy-btn" data-action="launch"></button>
            <p id="lab-note" class="muted-note"></p>
          </div>
        </div>
        <p id="sell-customers" class="muted-note"></p>
      </section>
      </div>
      <section id="upgrades" class="panel" hidden>
        <h2>Ideas</h2>
        <div id="upgrade-list"></div>
      </section>
    </div>

    <section id="next-stage" class="panel" hidden>
      <h2>To be continued</h2>
      <p>The next stage is not built yet.</p>
      <p>Your speed carries over: <b id="legacy-rate"></b>.</p>
      <button class="buy-btn" data-action="reset">Start again from 1939</button>
    </section>
  </main>

  <div id="announce" class="visually-hidden" aria-live="polite"></div>

  <footer>
    <button class="link-btn" data-action="reset">Reset game</button>
    <div id="dev-tools" hidden></div>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
